name: EfectoBot

# El bot corre 5.5 horas por corrida (límite de GitHub: 6 h por job) y al
# terminar se relanza solo → queda "siempre encendido" con huecos de ~1-2 min.
# El cron cada 6 h es respaldo por si la cadena se corta (crash, mantenimiento).
on:
  workflow_dispatch:
  schedule:
    - cron: "43 */6 * * *"

permissions:
  actions: write
  contents: write   # para el commit keepalive

# Nunca dos bots a la vez: Telegram da error 409 si hay dos polling del mismo
# token. Una corrida nueva espera en cola a que termine la actual.
concurrency:
  group: efectobot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5

      # 3.11 y no 3.12: Pillow 9.5 (obligatorio para moviepy 1.0.3) no tiene
      # wheels para 3.12 y compilarlo desde fuente falla en el runner.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verificar secret del bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_TOKEN" ]; then
            echo "::error::Falta el secret TELEGRAM_TOKEN (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Instalar dependencias
        run: |
          # ffmpeg venía en packages.txt (apt de Streamlit Cloud); el runner de
          # GitHub ya no lo trae y sin él moviepy no puede escribir los videos.
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -U pip
          pip install -r requirements.txt

      - name: Sanity check de imports
        run: python -c "import telebot, moviepy.editor, skimage, PIL; print('imports OK, Pillow', PIL.__version__)"

      # Videos de más de 20 MB: la Bot API pública no deja que un bot los baje
      # ("file is too big"). El servidor oficial de Telegram corriendo acá mismo
      # en modo --local sube el límite a 2 GB. Necesita TELEGRAM_API_ID y
      # TELEGRAM_API_HASH (my.telegram.org); sin ellos el bot sigue como antes.
      # Corre con el usuario del runner para que el bot pueda leer los archivos.
      - name: Servidor local de Telegram (videos de hasta 2 GB)
        id: tgapi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -z "$TELEGRAM_API_ID" ] || [ -z "$TELEGRAM_API_HASH" ]; then
            echo "::warning::Faltan TELEGRAM_API_ID / TELEGRAM_API_HASH: el bot sigue con el límite de 20 MB"
            exit 0
          fi
          DIR=/var/lib/telegram-bot-api
          sudo mkdir -p "$DIR" && sudo chown "$(id -u):$(id -g)" "$DIR"
          docker run -d --name tgapi --network host --user "$(id -u):$(id -g)" \
            -e TELEGRAM_API_ID -e TELEGRAM_API_HASH -v "$DIR:$DIR" \
            --entrypoint telegram-bot-api aiogram/telegram-bot-api:10.2 \
            --local --dir="$DIR" --temp-dir=/tmp --http-ip-address=127.0.0.1 --http-port=8081
          for i in $(seq 1 30); do
            if curl -s "http://127.0.0.1:8081/bot${TELEGRAM_TOKEN}/getMe" | grep -q '"ok":true'; then
              # El bot tiene que salir del servidor público para recibir los
              # mensajes por el local. Si ya salió antes, Telegram da error: no importa.
              curl -s "https://api.telegram.org/bot${TELEGRAM_TOKEN}/logOut"; echo
              echo "Servidor local listo"
              echo "url=http://127.0.0.1:8081" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          docker logs tgapi 2>&1 | tail -40
          echo "::warning::El servidor local no arrancó: el bot sigue con el límite de 20 MB"

      - name: Correr bot (5.5 horas)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_LOCAL_API: ${{ steps.tgapi.outputs.url }}
        run: |
          START=$(date +%s)
          EXIT=0
          timeout --signal=SIGINT 19800 python app.py || EXIT=$?
          ELAPSED=$(( $(date +%s) - START ))
          echo "app.py terminó con código $EXIT tras ${ELAPSED}s"
          # Si murió en menos de 5 min es un error de arranque: NO relanzar en
          # cadena (evita un loop infinito de corridas); el cron lo reintentará.
          if [ "$ELAPSED" -lt 300 ]; then
            echo "::error::El bot murió a los ${ELAPSED}s — revisa los logs de arriba"
            exit 1
          fi

      # GitHub APAGA los workflows con cron si el repo pasa 60 días sin
      # commits (le pasó a este bot el 2026-09: la cadena moría con "HTTP 422:
      # Cannot trigger a 'workflow_dispatch' on a disabled workflow" y el bot
      # quedó mudo). Si el último commit tiene más de 30 días, dejamos uno
      # vacío para que el repo cuente como activo. No frena el relanzamiento.
      - name: Mantener vivo el repo (regla de 60 días de GitHub)
        run: |
          AGE_DAYS=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Último commit hace ${AGE_DAYS} días"
          if [ "$AGE_DAYS" -ge 30 ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: evitar que GitHub apague el workflow por inactividad"
            git push || echo "::warning::No se pudo empujar el commit keepalive"
          fi

      - name: Relanzar siguiente corrida
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --repo ${{ github.repository }}
